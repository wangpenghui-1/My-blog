<div class="search-dialog" data-search-dialog hidden>
  <button class="search-backdrop" type="button" data-search-close aria-label="关闭搜索"></button>
  <section class="search-dialog-panel glass-surface" data-glass="refractive" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title">
    <div class="search-dialog-head">
      <div><span>Garden Search</span><h2 id="search-dialog-title">搜索数字花园</h2></div>
      <button type="button" data-search-close aria-label="关闭搜索">Esc</button>
    </div>
    <label class="search-field" for="search-dialog-input">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      <input id="search-dialog-input" data-search-input type="search" autocomplete="off" maxlength="80" placeholder="标题、摘要或标签" aria-label="搜索文章">
      <kbd>⌘ K</kbd>
    </label>
    <div class="search-status" data-search-status aria-live="polite">最近更新</div>
    <ul class="search-results" data-search-results aria-label="搜索结果"></ul>
    <div class="search-dialog-foot"><span>↑↓ 选择</span><span>Enter 打开</span><a href="{{ "search/" | absLangURL }}">完整搜索页 ↗</a></div>
    <i class="glass-specular" aria-hidden="true"></i>
  </section>
</div>
